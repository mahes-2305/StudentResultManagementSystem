<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-box">

    <h2>Add Student</h2>

    <input
        type="text"
        id="name"
        placeholder="Student Name">

    <input
        type="text"
        id="roll_no"
        placeholder="Roll Number">

    <input
        type="text"
        id="department"
        placeholder="Department">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="addStudentBtn">

        Add Student

    </button>

    <br><br>

    <button onclick="location.href='admin.html'">

        Back

    </button>

</div>

<script src="js/student.js"></script>

</body>

</html>
