<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>

<link rel="stylesheet" href="css/style.css?v=2"></head>

<body>

<div class="container">

    <div class="left">

        <h1>Student Result Management System</h1>

        <p>
            Cloud Based Student Result Management System
            using Flask, Docker, Jenkins and AWS.
        </p>

    </div>

    <div class="right">

        <div class="login-box">

            <h2>Login</h2>

            <select id="userType">

                <option value="student">Student</option>

                <option value="admin">Admin</option>

            </select>

            <input
                type="text"
                id="username"
                placeholder="Username / Roll Number">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button id="loginBtn">
    Login
</button>

            <p id="message"></p>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
